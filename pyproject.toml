[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-deepseek-vision"
version = "1.2.8"
description = "Codex vision bridge for DeepSeek V4 Flash: give text-only models image capability in Codex via a free local image-to-text proxy (GLM-4V-Flash or any OpenAI-compatible vision API)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Simon" }]
keywords = [
    "codex",
    "codex-vision",
    "deepseek",
    "deepseek-v4-flash",
    "vision",
    "vision-bridge",
    "image-to-text",
    "proxy",
    "glm-4v",
    "openai-compatible",
    "responses-api",
    "text-only-model",
    "ocr",
    "agent",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
agent-vision = "agent_vision.cli:main"

[project.urls]
Homepage = "https://github.com/SIMON-WORLD/codex-deepseek-vision"
Repository = "https://github.com/SIMON-WORLD/codex-deepseek-vision"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
